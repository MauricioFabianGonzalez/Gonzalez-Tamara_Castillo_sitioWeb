name: Verificar sitio estático
on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Revisar sintaxis JavaScript
        run: node --check js/site.js
      - name: Validar páginas y enlaces locales
        run: npm test
